name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 这个名字就是分支保护里要求的 status check（main 必须先过它才能合并）
    name: functional-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # MoviePilot V3 标准镜像用 CPython 3.14
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安装依赖
        run: python -m pip install -r requirements-dev.txt

      - name: 编译与清单自检
        run: |
          python -m compileall -q plugins.v3/colaseedgroup
          python .github/scripts/check_manifest.py

      - name: ruff
        run: ruff check .

      - name: 单元测试
        run: python -m unittest discover -s tests -v
