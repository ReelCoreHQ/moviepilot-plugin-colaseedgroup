# 本仓库的静态检查策略（ruff）。
#
# 为什么需要这份配置：仓库没有 ruff 配置时，工具会套用运行环境的全局配置，
# 对一份「中文注释 + 兼容 MoviePilot v1/v2/v3 的宽 except」的插件报出上千条噪音，
# 真正的问题被埋掉。这里显式声明本仓库认可的写法，让检查结果可判定。
line-length = 140
target-version = "py311"

[lint]
# E/F：语法、未定义名、未使用变量（真 bug）；W：空白；I：导入顺序。
# 只选这四类：它们是「写错了」而不是「风格偏好」，其余规则本仓库不认。
select = ["E", "F", "W", "I"]

ignore = [
  # 中文注释与 docstring 用全角标点是本仓库的书写习惯。
  "RUF001", "RUF002", "RUF003",
]

[lint.per-file-ignores]
# 中文注释与 docstring 用全角标点（命令行 --select 会覆盖 lint.select，但 per-file-ignores 仍然生效，
# 所以这条放在这里而不是 lint.ignore）。
"**/*.py" = ["RUF001", "RUF002", "RUF003"]
# 测试里允许 assert、允许用 lambda 造替身、允许忽略被测函数返回的一部分；
# RUF059 是「解包后没用到的返回值」，在夹具里正是不关心的那些。
"tests/**" = ["E741", "RUF059", "PIE807", "B009", "UP031", "B017", "UP012"]
